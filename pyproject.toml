[project]
name = "sea-otter"
version = "0.1.0"
description = "CISA cybersecurity advisory dataset collector"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "beautifulsoup4>=4.13",
    "click>=8.0",
    "aiofiles>=24.0",
    "tqdm>=4.0",
]

[project.scripts]
sea-otter = "sea_otter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sea_otter"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=sea_otter --cov-report=xml --cov-report=term-missing"

[tool.coverage.run]
source = ["src/sea_otter"]
omit = ["tests/*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
# E501 line-length violations in string literals / HTML fixtures are harmless
per-file-ignores = {"tests/fixtures.py" = ["E501"], "tests/test_listing.py" = ["E501"], "tests/test_storage.py" = ["E501"]}

[tool.ruff.lint.extend-per-file-ignores]
"src/sea_otter/collector/listing.py" = ["E501"]  # long HTTP header strings
"src/sea_otter/collector/advisory.py" = ["E501"]
"src/sea_otter/collector/downloader.py" = ["E501"]
"src/sea_otter/cli.py" = ["E501"]
"src/sea_otter/storage/db.py" = ["E501"]
