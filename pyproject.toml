[project]
name = "sea-otter"
version = "0.1.0"
description = "CISA cybersecurity advisory dataset collector"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "beautifulsoup4>=4.13",
    "click>=8.0",
    "aiofiles>=24.0",
    "tqdm>=4.0",
]

[project.scripts]
sea-otter = "sea_otter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sea_otter"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
